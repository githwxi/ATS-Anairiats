name: Ubuntu CI

on:
  schedule:
    - cron: '0 2 1 * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    # The project depends on PCRE 1 (libpcre3-dev); newer Ubuntu images may
    # only provide PCRE2, which is not API-compatible with this codebase.
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install build dependencies
        run: ./travis-ci/install-ubuntu.sh

      - name: Build and run tests
        run: ./travis-ci/test-ubuntu.sh
