name: Ubuntu CI

on:
  schedule:
    - cron: '0 2 1 * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install build dependencies
        run: ./travis-ci/install-ubuntu.sh

      - name: Build and run tests
        run: ./travis-ci/test-ubuntu.sh
